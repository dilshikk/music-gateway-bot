# alembic.ini — конфигурация Alembic для music-gateway-bot

[alembic]
# Путь к папке с миграциями (относительно этого файла)
script_location = infrastructure/database/migrations

# Шаблон имён файлов миграций
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Папка для временных файлов
prepend_sys_path = .

# URL базы данных — берётся из env.py через переменную окружения DATABASE_URL
# Здесь оставляем заглушку; реальный URL подставляет env.py
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/dbname

[post_write_hooks]
# Автоформатирование файлов миграций через black (опционально)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
