[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --timeout=30
    --tb=short
    -q
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-omit=tests/*,*/__init__.py,*/migrations/*

filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
